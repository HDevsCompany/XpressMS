<!DOCTYPE html>
<!-- Página principal de XpressMS: aquí vive el chat con el agente. -->
<!-- Los estilos están en static/css y los scripts en static/js: esta página solo arma la estructura. -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Hace que la página se vea bien en celulares -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XpressMS · Servicio técnico</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/chat.css">
  <link rel="stylesheet" href="/static/css/componentes.css">
  <link rel="stylesheet" href="/static/css/carnet.css">
</head>
<body>
  <main class="chat">
    <header class="chat-cabecera">
      <div>
        <h1>H&amp;Devs · Servicio técnico</h1>
        <p>Asistente virtual</p>
      </div>
      <!-- Olvida la conversación actual y empieza una nueva (útil para probar el registro otra vez). -->
      <button id="nueva-conversacion" class="boton-cabecera" type="button">Nueva conversación</button>
    </header>

    <!-- Aquí los scripts van agregando burbujas, tarjetas y botones. "aria-live" avisa a los lectores de pantalla. -->
    <div id="mensajes" aria-live="polite"></div>

    <!-- Formulario para escribir. "autocomplete=off" evita sugerencias del navegador. -->
    <form id="formulario" class="chat-formulario" autocomplete="off">
      <input id="texto" type="text" placeholder="Escribe tu mensaje..." required>
      <button type="submit">Enviar</button>
    </form>
  </main>

  <!-- type="module" permite que los scripts se importen entre sí (import / export). -->
  <script type="module" src="/static/js/chat.js"></script>
</body>
</html>
