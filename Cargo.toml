[package]
name = "xpressms"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
axum = "0.8.9"
dotenvy = "0.15.7"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.28.0", features = ["v4"] }
# Las dependencias las agregamos paso a paso.
